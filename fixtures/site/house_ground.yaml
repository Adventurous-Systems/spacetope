# A single-level house: a hall serves every room, and three room-to-room doors make the adjacency
# graph richer than a plain star (living–dining, kitchen–dining, kitchen–utility).
# Orientation wishes added for M21: true north points to plan -y (north 180), so the sun side is the plan's +y side;
# the wishes are the plan-y mirror image of the usual living-south, kitchen-east, study-north house.
