# The family spacetope's synthetic briefs have always drawn from, written down (replaces spacetope/synth.py's
# hard-coded room list). One to three levels of offices and meeting rooms off a corridor.
name: office
levels: {min: 1, max: 3}
level_height: 3.0
envelope: {area_factor: [1.9, 2.6], aspect: [1.4, 2.6]}
circulation:
  corridor: {w: 1.8, l: from_frontage}
  stairs: {count: 1, w: 3, l: 5}
  lifts: {count: 1, w: 2.5, l: 2.5}
rooms:
  - {type: office, w: 4, l: 3, count: [4, 10], exterior: 0.6, level: any}
  - {type: meeting, w: 5, l: 4, count: [1, 3], exterior: 0.6, level: any}
  - {type: studio, w: 6, l: 4, count: [0, 2], exterior: 0.8, level: any}
  - {type: kitchen, w: 3, l: 3, count: 1, level: ground}
  - {type: quiet, w: 2.5, l: 2.5, count: [0, 2], level: any}
  - {type: wc, w: 2, l: 3, count_per_level: 1}
  - {type: storage, w: 2, l: 2, count_per_level: 1}
adjacency:
  - {between: [meeting, kitchen], p: 0.5, door: true}
tolerance: {room: 0.10, corridor: {l: [-0.5, 2.0]}}
