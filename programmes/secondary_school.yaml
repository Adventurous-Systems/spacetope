# Two or three levels of classrooms, with science labs sharing a prep room and a canteen chained to its
# kitchen and store. The attach chains are what give this family a rich wish graph.
name: secondary_school
levels: {min: 2, max: 3}
level_height: 3.5
envelope: {area_factor: [1.7, 2.3], aspect: [1.8, 3.0]}
circulation:
  corridor: {w: 2.4, l: from_frontage}
  stairs: {count: 2, w: 3, l: 6}
  lifts: {count: 1, w: 2.4, l: 2.4}
  doors: {room: {w: 0.9, h: 2.1}, jamb: 0.1}
rooms:
  - {type: classroom, w: 8, l: 7, count: [10, 18], exterior: 1.0, level: any}
  - {type: science_lab, w: 10, l: 7, count: [1, 2], exterior: 1.0, level: upper,
     attach: {type: prep_room, w: 4, l: 5, door: true}}
  - {type: library, w: 10, l: 7, count: 1, exterior: 1.0, level: ground}
  - {type: canteen, w: 12, l: 8, count: 1, exterior: 1.0, level: ground,
     attach: {type: kitchen, w: 6, l: 5, door: true, attach: {type: kitchen_store, w: 3, l: 3, door: true}}}
  - {type: staff_room, w: 7, l: 5, count: 1, exterior: 0.8, level: ground,
     attach: {type: head_office, w: 4, l: 3.5, door: true}}
  - {type: wc, w: 4, l: 4, count_per_level: 2}
  - {type: store, w: 3, l: 3, count_per_level: 1}
tolerance: {room: 0.10, corridor: {l: [-0.5, 2.0]}}
